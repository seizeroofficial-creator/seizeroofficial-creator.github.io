  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #0a0014;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  body {
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-style: italic;
    color: #fff;
    position: fixed;
    inset: 0;
  }

  #vicecity {
    display: none;
    position: absolute; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  body.bg #vicecity { display: block; }
  .scene {
    position: absolute; inset: 0; opacity: 0;
    transition: opacity 2.5s ease-in-out;
    will-change: opacity;
  }
  .scene.on { opacity: 1; }
  .scene img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center center;
    transform: scale(1.05);
    animation: kenA 32s ease-in-out infinite alternate;
  }
  .s2 img { animation-name: kenB; transform-origin: 40% 50%; }
  .s3 img { animation-name: kenC; transform-origin: 55% 40%; }
  .s4 img { animation-name: kenB; transform-origin: 60% 50%; }
  @keyframes kenA {
    from { transform: scale(1.0) translate(0, 0); }
    to   { transform: scale(1.08) translate(-1.1%, -0.5%); }
  }
  @keyframes kenB {
    from { transform: scale(1.07) translate(0.8%, 0); }
    to   { transform: scale(1.0) translate(-0.6%, 0.4%); }
  }
  @keyframes kenC {
    from { transform: scale(1.0) translate(0, 0.3%); }
    to   { transform: scale(1.08) translate(0.8%, -0.6%); }
  }
  .vignette {
    position: absolute; inset: 0; z-index: 1; pointer-events: none;
    background:
      radial-gradient(ellipse 120% 58% at 50% 28%, rgba(6,0,16,.62) 0%, rgba(6,0,16,.28) 46%, transparent 74%),
      linear-gradient(to top, rgba(0,0,0,.42) 0%, transparent 30%),
      linear-gradient(to bottom, rgba(0,0,0,.38) 0%, transparent 16%);
  }

  .char {
    position: absolute;
    bottom: 0;
    bottom: env(safe-area-inset-bottom, 0px);
    height: 42dvh;
    width: auto;
    max-width: 54vw;
    object-fit: contain;
    object-position: bottom center;
    pointer-events: none;
    z-index: 2;
    filter:
      drop-shadow(0 0 1.6vw rgba(255,79,160,.85))
      drop-shadow(0 0 4.2vw rgba(255,138,61,.5));
  }
  .char.lucia { left: -6vw; }
  .char.jason { right: -6vw; }

  .wrap {
    position: absolute;
    top: 0; left: 0; right: 0;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
    padding-top: max(1.2vh, env(safe-area-inset-top, 0px));
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  .logo {
    width: 62vw;
    max-width: 280px;
    height: auto;
    display: block;
    filter:
      drop-shadow(0 0.6vw 0.25vw rgba(0,0,0,.9))
      drop-shadow(0 1vw 2.2vw rgba(0,0,0,.75));
  }
  .headline {
    font-family: "Pacifico", cursive;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(1.05rem, 5.8vw, 1.55rem);
    line-height: 1.2;
    white-space: nowrap;
    color: #ff4fb8;
    margin: 0.2vh 0 1.6vh;
    text-shadow:
      0 0 0.3vw #fff,
      0 0 0.9vw #ff7ad9,
      0 0 2.2vw #ff3db4,
      0 0 4vw #ff2ea6,
      0 0.5vw 0.8vw rgba(0,0,0,.85);
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.2vw 2.6vw;
    width: 78vw;
    max-width: 22rem;
    margin: 0 auto;
  }
  .unit {
    padding: 1.6vw 2vw 1.3vw;
    background: rgba(6,0,18,.82);
    border: 0.55vw solid #ff4fa0;
    border-radius: 3vw;
    box-shadow:
      0 0 1.6vw #ff4fa0,
      0 0 4vw rgba(255,79,160,.55),
      inset 0 0 2.4vw rgba(255,79,160,.28);
  }
  .num {
    font-family: "Barlow Condensed", Impact, sans-serif;
    font-style: italic;
    font-weight: 700;
    font-size: 15vw;
    line-height: 0.95;
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow:
      0 0 0.3vw #fff,
      0 0 1.4vw #ff9ae0,
      0 0 3vw #ff4fa0,
      0 0 5vw rgba(255,79,160,.7);
  }
  .lbl {
    font-family: "Barlow Condensed", sans-serif;
    font-style: italic;
    font-weight: 500;
    font-size: 3.5vw;
    letter-spacing: 0.22em;
    color: #ffc2e8;
    margin-top: 0.2vw;
    text-shadow: 0 0 1.2vw #ff4fa0, 0 0.3vw 0.5vw rgba(0,0,0,.8);
  }
  .sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2.4vw;
    margin-top: 1.8vh;
    font-family: "Barlow Condensed", sans-serif;
    font-style: italic;
    font-weight: 700;
    font-size: 3.7vw;
    letter-spacing: 0.16em;
    color: #ffe8f6;
    padding: 0.3vw 0.8vw;
    text-shadow:
      0 0 0.8vw #ff4fa0,
      0 0 2vw #ff4fa0,
      0 0 2.4vw #000,
      0 0.4vw 0.8vw #000,
      0 0 3.5vw rgba(0,0,0,.95);
  }
  .sub::before, .sub::after {
    content: "";
    width: 9vw;
    height: 0.4vw;
    background: #ff4fa0;
    box-shadow: 0 0 1vw #ff4fa0, 0 0 2.2vw #ff4fa0;
    border-radius: 1vw;
    flex: 0 0 auto;
  }
  .live {
    font-family: "Barlow Condensed", sans-serif;
    font-style: italic;
    font-weight: 700;
    font-size: 14vw;
    letter-spacing: 0.06em;
    color: #fff;
    text-shadow:
      0 0 0.5vw #fff,
      0 0 2.4vw #ff4fa0,
      0 0 5vw #ff8a3d,
      0 0 7vw #ff2ea6;
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.06); } }
  .num.tickanim { animation: tickpop .35s ease-out; }
  @keyframes tickpop {
    0% { transform: translateY(-12%) scale(1.12); opacity: .5; text-shadow: 0 0 4vw #fff, 0 0 6vw #ff4fa0; }
    100% { transform: none; opacity: 1; }
  }

  /* Landscape phones / short screens: compact top stack, timer in a row, characters flank */
  @media (orientation: landscape) {
    .logo {
      width: auto;
      height: 22vh;
      max-width: 28vw;
    }
    .headline {
      font-size: clamp(0.95rem, 4.6vh, 1.4rem);
      margin: 0.2vh 0 1.1vh;
    }
    .grid {
      display: flex;
      flex-direction: row;
      justify-content: center;
      width: auto;
      max-width: none;
      gap: 1.4vh;
    }
    .unit {
      min-width: 14vh;
      padding: 0.7vh 1.1vh 0.6vh;
      border-width: 0.35vh;
      border-radius: 1.3vh;
    }
    .num { font-size: 8.2vh; }
    .lbl { font-size: 2.1vh; }
    .sub {
      font-size: 2.5vh;
      margin-top: 1.2vh;
      gap: 1.4vh;
    }
    .sub::before, .sub::after {
      width: 8vh;
      height: 0.28vh;
    }
    .char {
      height: 92dvh;
      max-width: 30vw;
    }
    .char.lucia { left: -2vw; }
    .char.jason { right: -2vw; }
    .live { font-size: 10vh; }
    .vignette {
      background:
        radial-gradient(ellipse 60% 80% at 50% 40%, rgba(6,0,16,.55) 0%, rgba(6,0,16,.22) 50%, transparent 75%),
        linear-gradient(to top, rgba(0,0,0,.28) 0%, transparent 26%);
    }
  }

  @media (orientation: portrait) and (max-height: 700px) {
    .logo { width: 52vw; }
    .headline { margin-bottom: 1vh; }
    .num { font-size: 13vw; }
    .char { height: 36dvh; }
  }
</style>

  <div class="headline">Countdown to GTA 6!</div>
  <div id="timer" class="grid">
    <div class="unit"><div class="num" id="d">00</div><div class="lbl">DAYS</div></div>
    <div class="unit"><div class="num" id="h">00</div><div class="lbl">HOURS</div></div>
    <div class="unit"><div class="num" id="m">00</div><div class="lbl">MINUTES</div></div>
    <div class="unit"><div class="num" id="s">00</div><div class="lbl">SECONDS</div></div>
  </div>
  <div class="sub" id="sub">NOVEMBER 19, 2026</div>
</div>

<script>
  // Phone web app. Background is on by default.
  //   ?cycle=SECONDS  scene interval (default 25; 0 pins the current scene)
  //   ?scene=1..4  start on that scene
  //     1 Vice City sign at sunset (Vice_City_01)
  //     2 golden-hour aerial, helicopter + Ferris wheel (Vice_City_11)
  //     3 night harbor / Ferris wheel skyline (Vice_City_08)
  //     4 neon gas station, palms, dusk skyline (Vice_City_22)
  //   ?bg=0  hide scenes (not typical on phone)
  const p = new URLSearchParams(location.search);
  if (p.get("bg") === "0") document.body.classList.remove("bg");
  (function(){
    const scenes = Array.from(document.querySelectorAll("#vicecity .scene"));
    if (!scenes.length) return;
    const rawScene = parseInt(p.get("scene") || "1", 10);
    let idx = Number.isFinite(rawScene) ? Math.min(Math.max(rawScene, 1), scenes.length) - 1 : 0;
    const show = i => scenes.forEach((s, j) => s.classList.toggle("on", j === i));
    show(idx);
    const rawCycle = p.get("cycle");
    const interval = rawCycle === null ? 25 : Number(rawCycle);
    if (p.get("bg") === "0") return;
    if (!Number.isFinite(interval) || interval <= 0) return;
    setInterval(() => { idx = (idx + 1) % scenes.length; show(idx); }, interval * 1000);
  })();
  // Launch: midnight local time, Nov 19 2026 (month is 0-based)
  const target = new Date(2026, 10, 19, 0, 0, 0).getTime();
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let diff = Math.max(0, target - Date.now());
    if (diff === 0) {
      document.getElementById("timer").outerHTML = "<div class=\"live\">IT'S OUT!</div>";
      document.getElementById("sub").textContent = "GO PLAY GTA VI";
      clearInterval(iv); return;
    }
    const s = Math.floor(diff / 1000);
    set("d", pad(Math.floor(s / 86400)));
    set("h", pad(Math.floor(s % 86400 / 3600)));
    set("m", pad(Math.floor(s % 3600 / 60)));
    set("s", pad(s % 60));
  }
  function set(id, v) {
    const el = document.getElementById(id);
    if (!el || el.textContent === v) return;
    el.textContent = v;
    el.classList.remove("tickanim"); void el.offsetWidth; el.classList.add("tickanim");
  }
  const iv = setInterval(tick, 250); tick();
</script>
